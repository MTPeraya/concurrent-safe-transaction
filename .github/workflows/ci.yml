name: Transaction Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Set up sbt for Scala Consumer
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # 4. Run Scala Consumer tests
      - name: Run Scala Consumer tests
        run: |
          cd transaction-consumer
          sbt test

      # 5. Run backend tests against PostgreSQL Testcontainers
      - name: Run backend tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            export JWT_SECRET=$(openssl rand -base64 32)
          fi
          chmod +x transaction-backend/mvnw
          ./transaction-backend/mvnw -f transaction-backend/pom.xml clean verify

      # 6. Build Docker images only if all tests pass
      - name: Build Docker images
        run: |
          docker build -t transaction-backend:latest ./transaction-backend
          docker build -t transaction-consumer:latest ./transaction-consumer
