kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
  topic = "transfers.completed"
  topic = ${?KAFKA_TOPIC}
  dlq-topic = "transfers.completed.dlq"
  dlq-topic = ${?KAFKA_DLQ_TOPIC}
  group-id = "audit-ledger-consumer-group"
  group-id = ${?KAFKA_GROUP_ID}
  max-poll-records = 50
  auto-offset-reset = "earliest"
}

cassandra {
  contact-points = "localhost:9042"
  contact-points = ${?CASSANDRA_CONTACT_POINTS}
  local-datacenter = "datacenter1"
  local-datacenter = ${?CASSANDRA_DC}
  keyspace = "transfer_audit"
  keyspace = ${?CASSANDRA_KEYSPACE}
  username = ""
  username = ${?CASSANDRA_USERNAME}
  password = ""
  password = ${?CASSANDRA_PASSWORD}
  secure-connect-bundle = ""
  secure-connect-bundle = ${?ASTRA_SECURE_CONNECT_BUNDLE}
}

consumer {
  max-retry-attempts = 3
  initial-backoff-ms = 500
}
