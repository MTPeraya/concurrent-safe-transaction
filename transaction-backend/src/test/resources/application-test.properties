# TEST ENVIRONMENT

spring.application.name=transaction-backend

# DATABASE CONFIGURATION
# PostgreSQL connection supplied by Testcontainers
# Spring Boot obtains datasource URL, username, password from @ServiceConnection.

# JPA / HIBERNATE
# Recreate database schema for isolated tests
spring.jpa.hibernate.ddl-auto=create-drop
# Display SQL queries during testing
spring.jpa.show-sql=true
# Format SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# HIKARI CONNECTION POOL
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Show Hibernate SQL statements
logging.level.org.hibernate.SQL=DEBUG

app.jwt.secret=${JWT_SECRET}
